{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'panel-header.html' %}
    {% include 'panel-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="administration-container">
        <div id="administration-wrapper" class="d-none">
          <h1 id="administration-headline">{% trans 'panel.administration.headline' %}</h1>
          <ul id="administration-groups">
          </ul>
          <button type="button" id="administration-group-add" class="btn btn-primary mt-4">{% trans 'panel.administration.group.add' %}</button>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var groups;
  var staffList;

  $(document).ready(function() {
    displayLoader();
    fetchGroupsData(function() {
      fetchStaffData(function() {
        displayGroups();
        removeLoader();
      });
    });
  });

  function fetchGroupsData(callback) {
    let request = new HttpRequest("/groups/", "GET", []);
    request.send(function (status, responseText) {
      groups = JSON.parse(responseText).groups.sort(function(firstGroup, secondGroup) {
        return secondGroup.priority - firstGroup.priority;
      });
      callback();
    });
  }

  function fetchStaffData(callback) {
    let request = new HttpRequest("/staff/", "GET", []);
    request.send(function (status, responseText) {
      staffList = JSON.parse(responseText).staff;
      callback();
    });
  }

  function displayGroups() {
    document.getElementById("administration-groups").innerHTML = "";
    for (let i = 0; i < groups.length; i++) {
      let group = groups[i];
      displayGroup(group.name, group.color,
        staffList.filter((staff) => staff.group === group.name));
    }
    let unassignedStaff = findUnassignedStaff();
    if (unassignedStaff.length === 0) {
      return;
    }
    displayGroup("{% trans 'panel.administration.group.unassigned' %}", undefined,
      unassignedStaff);
  }

  function findUnassignedStaff() {
    let unassignedStaff = [];
    for (let staff of staffList) {
      let groupFound = false;
      for (let group of groups) {
        if (staff.group === group.name) {
          groupFound = true;
          break;
        }
      }
      if (!groupFound) {
        unassignedStaff.push(staff);
      }
    }
    return unassignedStaff;
  }

  function displayGroup(name, color, groupStaff) {
    var groupElement = document.createElement("li");
    groupElement.classList.add("mb-4");
    var groupHeaderElement = document.createElement("div");
    groupHeaderElement.classList.add("administration-group-header");
    var groupNameContainer = document.createElement("div");
    groupNameContainer.classList.add("d-flex", "align-items-center");
    var groupNameElement = document.createElement("h2");
    if (color) {
      groupNameElement.style.color = color;
    }
    groupNameElement.innerHTML = name;
    groupNameContainer.appendChild(groupNameElement);
    var groupSizeElement = document.createElement("h2");
    groupSizeElement.classList.add("ms-2");
    groupSizeElement.innerHTML = "(" + groupStaff.length + "):";
    groupNameContainer.appendChild(groupSizeElement);
    groupHeaderElement.appendChild(groupNameContainer);
    var groupEditElement = document.createElement("button");
    groupEditElement.classList.add("btn", "btn-success", "administration-group-edit");
    groupEditElement.type = "button";
    groupEditElement.innerHTML = "{% trans 'panel.administration.group.edit' %}";
    groupEditElement.onclick = function (event) {
      window.location.href = "/group/" + name.toLowerCase() + "/";
    }
    groupHeaderElement.appendChild(groupEditElement);
    groupElement.appendChild(groupHeaderElement);
    var groupStaffElement = document.createElement("ul");
    groupStaffElement.classList.add("administration-group-staff-list");
    for (var i = 0; i < groupStaff.length; i++) {
      var staff = groupStaff[i];
      groupStaffElement.appendChild(createStaffElement(staff.id, staff.name));
    }
    if (groupStaff.length === 0) {
      var groupEmptyElement = document.createElement("h6");
      groupEmptyElement.classList.add("mt-4");
      groupEmptyElement.innerHTML = "{% trans 'panel.administration.group.empty' %}";
      groupElement.appendChild(groupEmptyElement);
    }
    groupElement.appendChild(groupStaffElement);
    document.getElementById("administration-groups").appendChild(groupElement);
  }

  function createStaffElement(staffId, staffName) {
    var staffElement = document.createElement("li");
    staffElement.classList.add("administration-group-staff");
    staffElement.role = "button";
    var staffInformationContainer = document.createElement("div");
    staffInformationContainer.classList.add("administration-group-staff-information");
    var staffIconElement = document.createElement("i");
    staffIconElement.classList.add("administration-group-staff-icon",
      "fa-regular", "fa-user");
    staffInformationContainer.appendChild(staffIconElement);
    var staffNameElement = document.createElement("span");
    staffNameElement.classList.add("administration-group-staff-name");
    staffNameElement.innerHTML = staffName;
    staffInformationContainer.appendChild(staffNameElement);
    staffElement.appendChild(staffInformationContainer);
    staffElement.onclick = function(event) {
      window.location.href = "/staff/" + staffId + "/";
    }
    return staffElement;
  }

  document.getElementById("administration-group-add").onclick = function (event) {
    var groupAddForm = document.createElement("div");
    groupAddForm.classList.add("administration-group-add-content");
    var groupAddDescription = document.createElement("p");
    groupAddDescription.innerText = "{% trans 'panel.administration.group.add.body' %}";
    groupAddForm.appendChild(groupAddDescription);
    var groupNameElement = document.createElement("input");
    groupNameElement.placeholder = "{% trans 'panel.administration.group.add.name' %}";
    groupAddForm.appendChild(groupNameElement);
    groupAddForm.appendChild(document.createElement("br"));
    var groupPriorityElement = document.createElement("input");
    groupPriorityElement.classList.add("mt-2");
    groupPriorityElement.placeholder = "{% trans 'panel.administration.group.add.priority' %}";
    groupAddForm.appendChild(groupPriorityElement);
    groupAddForm.appendChild(document.createElement("br"));
    var groupColorElement = document.createElement("input");
    groupColorElement.classList.add("mt-2");
    groupColorElement.type = "color";
    groupColorElement.value = "#ffffff";
    groupAddForm.appendChild(groupColorElement);
    Swal.fire({
      title: "{% trans 'panel.administration.group.add.title' %}",
      html: groupAddForm,
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        var name = groupNameElement.value;
        var priority = groupPriorityElement.value;
        var color = groupColorElement.value;
        let request = new HttpRequest("/group/add/", "POST", [],
          {name: name, priority: priority, color: color});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'panel.administration.group.add.successful.title' %}", "{% trans 'panel.administration.group.add.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("administration-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("administration-container")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("administration-wrapper").classList.remove("d-none");
  }
</script>
